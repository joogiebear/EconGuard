# EconGuard: shared economy audit and anti-abuse core. Other plugins report money movements here;
# EconGuard keeps one ledger and flags suspicious patterns for staff to review.

# Currency symbol used only for formatting alert/console messages.
currency-symbol: "$"

# Notify online players with econguard.alerts when an alert or flag fires.
notify-staff: true

# Optional Discord webhook for alerts and flags. Leave blank to disable.
discord-webhook: ""

# Storage backend: SQLITE (default, single server) or MYSQL (one shared ledger for a network).
storage:
  type: SQLITE
  sqlite-file: "econguard.db"
  mysql:
    host: localhost
    port: 3306
    database: econguard
    username: root
    password: ""
    properties: "useSSL=false&allowPublicKeyRetrieval=true"
    pool-size: 10

database:
  # Keep at most this many ledger rows per player (pruned on startup). 0 = unlimited.
  max-rows-per-player: 500

# The velocity and young-incoming signals only flag young accounts, so veterans selling a lucky drop aren't flagged.
young-account:
  max-age-days: 3          # account first joined within this many days counts as young
  max-playtime-hours: 10   # OR online playtime below this many hours counts as young

# Enforcement. Detection only ever raises flags; this decides what a flag DOES.
enforcement:
  # true: plugins that check EconGuard before a trade (RoyalBazaar, RoyalTrade) refuse trades from
  #       flagged players until the flag is cleared with /econguard flags clear.
  # false (default): flags are alert-only, so a false positive never locks a legitimate player out.
  block-flagged-trades: false

detection:
  # A single transaction at/above this magnitude is logged as a large-transaction alert.
  large-transaction: 100000000.0

  # A young account receiving a single incoming transfer (pay / auction sale) at/above this is flagged.
  young-incoming-transfer: 50000000.0

  # Velocity: a YOUNG account gaining at/above this much (incoming) within the window is flagged.
  velocity:
    enabled: true
    window-minutes: 30
    threshold: 250000000.0

  # Counterparty correlation: if the same payer funds the same receiver at/above this total within the
  # window, both are flagged for collusion (catches RMT rings regardless of account age). 0 = off.
  counterparty:
    enabled: true
    window-minutes: 60
    threshold: 500000000.0

